<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeopardy!</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;background:linear-gradient(135deg,#0a0a1a 0%,#1a1a3a 50%,#0a0a1a 100%);font-family:'Bebas Neue',Impact,sans-serif;color:#fff}
.hidden{display:none!important}

.home-wrapper{max-width:900px;margin:0 auto;padding:60px 20px}
.logo-section{text-align:center;margin-bottom:50px;position:relative}
.logo-accent{position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:200px;height:8px;background:linear-gradient(90deg,transparent,#FFD700,transparent);border-radius:4px}
.main-title{font-size:72px;letter-spacing:8px;color:#FFD700;text-shadow:0 0 30px rgba(255,215,0,.5),0 4px 0 #B8860B}
.subtitle{font-size:24px;color:#8888aa;letter-spacing:12px;margin:10px 0 0}
.create-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:24px 40px;font-size:24px;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:3px;background:linear-gradient(135deg,#1a3a8a,#0a1a4a);border:3px solid #3366cc;border-radius:8px;color:#FFD700;cursor:pointer}
.games-section{margin-top:50px}
.section-title{font-size:28px;color:#8888aa;letter-spacing:4px;margin-bottom:20px}
.games-list{display:flex;flex-direction:column;gap:12px}
.game-card{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;background:rgba(26,58,138,.3);border:2px solid #3366cc;border-radius:8px}
.game-title{font-size:22px;color:#fff;margin:0 0 4px;letter-spacing:2px}
.game-date{font-size:14px;color:#6666aa;margin:0;font-family:system-ui,sans-serif}
.game-actions{display:flex;gap:10px}
.btn-play{padding:10px 20px;font-size:16px;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:2px;background:linear-gradient(135deg,#228B22,#006400);border:2px solid #32CD32;border-radius:4px;color:#fff;cursor:pointer}
.btn-edit{padding:10px 20px;font-size:16px;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:2px;background:linear-gradient(135deg,#1a3a8a,#0a1a4a);border:2px solid #3366cc;border-radius:4px;color:#FFD700;cursor:pointer}
.btn-del{padding:10px 14px;font-size:16px;background:rgba(139,0,0,.5);border:2px solid #8B0000;border-radius:4px;color:#FF6B6B;cursor:pointer}

#edit-view,#play-view{height:100vh;display:flex;flex-direction:column;overflow:hidden}
.edit-header,.play-header{display:flex;align-items:center;gap:20px;padding:15px 20px;background:rgba(0,0,0,.5);border-bottom:2px solid #3366cc;flex-wrap:wrap;flex-shrink:0}
.back-btn{padding:8px 15px;font-size:16px;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:2px;background:transparent;border:2px solid #666;border-radius:4px;color:#aaa;cursor:pointer;white-space:nowrap}
.title-input{flex:1;min-width:150px;padding:10px 15px;font-size:20px;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:2px;background:rgba(255,255,255,.1);border:2px solid #3366cc;border-radius:4px;color:#FFD700;outline:none}
.header-actions{display:flex;gap:10px}
.save-btn{padding:10px 18px;font-size:16px;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:2px;background:linear-gradient(135deg,#228B22,#006400);border:2px solid #32CD32;border-radius:4px;color:#fff;cursor:pointer;display:flex;align-items:center;gap:8px}
.save-btn:disabled{opacity:.7;cursor:not-allowed}
.save-spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.preview-btn{padding:10px 18px;font-size:16px;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:2px;background:linear-gradient(135deg,#1a3a8a,#0a1a4a);border:2px solid #3366cc;border-radius:4px;color:#FFD700;cursor:pointer;white-space:nowrap}
.fullscreen-btn{padding:8px 14px;font-size:14px;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:1px;background:transparent;border:2px solid #666;border-radius:4px;color:#aaa;cursor:pointer;white-space:nowrap}
.board-container{flex:1;display:flex;flex-direction:column;padding:15px 20px;overflow:hidden}
.board{flex:1;display:flex;flex-direction:column;gap:4px}
.cat-row,.q-row{display:flex;gap:4px;flex-shrink:0}
.cat-row{flex:0 0 auto}
.q-row{flex:1;min-height:0}
.cat-input{flex:1;min-width:0;padding:12px 8px;font-size:clamp(12px,1.5vw,18px);font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:1px;text-align:center;background:linear-gradient(180deg,#1a3a8a,#0a1a4a);border:3px solid #3366cc;border-radius:4px;color:#fff;outline:none;text-transform:uppercase}
.cat-header{flex:1;min-width:0;padding:12px 8px;font-size:clamp(12px,1.5vw,18px);font-family:'Bebas Neue',Impact,sans-serif;text-align:center;background:linear-gradient(180deg,#1a3a8a,#0a1a4a);border:3px solid #3366cc;border-radius:4px;color:#fff;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}
.edit-cell{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#1a3a8a,#0a1a4a);border:3px solid #3366cc;border-radius:4px;cursor:pointer;transition:border-color .2s}
.edit-cell:hover{border-color:#FFD700}
.edit-cell.filled{background:linear-gradient(180deg,#2a4a9a,#1a2a5a);border-color:#4488ee}
.cell-pts{font-size:clamp(18px,2.5vw,28px);color:#FFD700}
.cell-check{font-size:16px;color:#32CD32}
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);z-index:1000}

/* ── EDIT POPUP ── */
.edit-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:580px;max-width:95vw;max-height:90vh;overflow-y:auto;padding:20px;background:linear-gradient(180deg,#1a2a5a,#0a1a3a);border:3px solid #FFD700;border-radius:8px;z-index:1001;box-shadow:0 10px 40px rgba(0,0,0,.8)}
.popup-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.popup-pts{font-size:24px;color:#FFD700}
.discard-btn{padding:5px 10px;font-size:14px;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:1px;background:rgba(139,0,0,.4);border:1px solid #8B0000;border-radius:4px;color:#FF6B6B;cursor:pointer}
.save-q-btn{padding:5px 14px;font-size:14px;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:1px;background:linear-gradient(135deg,#228B22,#006400);border:2px solid #32CD32;border-radius:4px;color:#fff;cursor:pointer}
.field-label{font-size:14px;color:#8888aa;letter-spacing:2px;margin-bottom:6px;display:block;font-family:'Bebas Neue',Impact,sans-serif}
.field-group{margin-bottom:14px}

/* Rich text toolbar */
.rt-toolbar{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;background:rgba(0,0,0,.4);border:2px solid #3366cc;border-bottom:none;border-radius:4px 4px 0 0;align-items:center}
.rt-btn{padding:4px 8px;font-size:13px;font-family:system-ui,sans-serif;background:rgba(255,255,255,.08);border:1px solid #444;border-radius:3px;color:#ddd;cursor:pointer;min-width:28px;text-align:center}
.rt-btn:hover{background:rgba(255,215,0,.15);border-color:#FFD700;color:#FFD700}
.rt-btn.active{background:rgba(255,215,0,.2);border-color:#FFD700;color:#FFD700}
.rt-sep{width:1px;height:20px;background:#444;margin:0 2px;flex-shrink:0}
.rt-area{width:100%;min-height:90px;padding:10px 12px;font-size:15px;font-family:system-ui,sans-serif;background:rgba(255,255,255,.08);border:2px solid #3366cc;border-radius:0 0 4px 4px;color:#fff;outline:none;line-height:1.5}
.rt-area.ans{background:rgba(50,205,50,.08);border-color:#32CD32}
.rt-area:focus{border-color:#FFD700}

/* Media attached badge shown in toolbar */
.media-badge{
  display:flex;align-items:center;gap:5px;padding:3px 8px;
  background:rgba(255,215,0,.12);border:1px solid #FFD700;border-radius:3px;
  font-size:12px;font-family:system-ui,sans-serif;color:#FFD700;
  cursor:default;
}
.media-badge-remove{
  cursor:pointer;color:#FF6B6B;font-size:14px;line-height:1;
  background:none;border:none;padding:0 0 0 4px;
}

/* ── MEDIA POPOVER ── */
.media-popover{
  position:fixed;z-index:1100;
  background:linear-gradient(180deg,#1a2a5a,#0a1a3a);
  border:2px solid #3366cc;border-radius:8px;
  padding:16px;width:320px;
  box-shadow:0 8px 32px rgba(0,0,0,.8);
}
.media-popover h4{font-size:16px;color:#FFD700;letter-spacing:2px;margin-bottom:12px}
.mp-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.mp-input{flex:1;padding:7px 10px;font-size:13px;font-family:system-ui,sans-serif;background:rgba(255,255,255,.08);border:2px solid #3366cc;border-radius:4px;color:#fff;outline:none}
.mp-input:focus{border-color:#FFD700}
.mp-btn{padding:7px 12px;font-size:12px;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:1px;background:linear-gradient(135deg,#1a3a8a,#0a1a4a);border:2px solid #3366cc;border-radius:4px;color:#FFD700;cursor:pointer;white-space:nowrap}
.mp-btn:hover{border-color:#FFD700}
.mp-btn.green{background:linear-gradient(135deg,#228B22,#006400);border-color:#32CD32;color:#fff}
.mp-hint{font-size:11px;color:#6666aa;font-family:system-ui,sans-serif;margin-bottom:10px;line-height:1.4}
.mp-label{display:block;font-size:11px;color:#8888aa;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:1px;margin-bottom:4px}
.mp-time-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.mp-time-input{width:80px;padding:6px 8px;font-size:13px;font-family:system-ui,sans-serif;background:rgba(255,255,255,.08);border:2px solid #3366cc;border-radius:4px;color:#fff;outline:none}
.mp-time-label{font-size:11px;color:#8888aa;font-family:system-ui,sans-serif}
.mp-close{position:absolute;top:10px;right:10px;padding:3px 8px;font-size:14px;background:transparent;border:1px solid #444;border-radius:3px;color:#aaa;cursor:pointer}
.mp-preview{margin-top:10px;font-size:12px;font-family:system-ui,sans-serif;color:#90EE90}

/* ── PLAY HEADER ── */
.play-header{flex-direction:column;align-items:stretch;padding:10px 20px}
.play-header-top{display:flex;align-items:center;gap:15px;width:100%}
.play-title{flex:1;font-size:clamp(20px,3vw,32px);letter-spacing:4px;color:#FFD700;text-align:center;margin:0}

/* ── SCOREBOARD ── */
#scoreboard{display:flex;align-items:flex-end;justify-content:flex-end;gap:8px;padding:8px 0 0;height:130px}
.team-tile{display:flex;flex-direction:column;align-items:center;width:110px;flex-shrink:0;transition:order 1.6s cubic-bezier(.4,0,.2,1),transform .7s cubic-bezier(.34,1.3,.64,1)}
.team-tile.lifting{transform:translateY(-18px)}
.tm-photo{width:60px;height:60px;border-radius:50%;background:#1a1a3a;display:flex;align-items:center;justify-content:center;font-size:24px;color:#FFD700;overflow:hidden;flex-shrink:0}
.tm-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.tm-name{font-size:13px;letter-spacing:1px;color:#ccc;margin:4px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:104px;text-align:center}
.tm-score{font-size:22px;font-weight:bold;color:#FFD700}
.tm-score.neg{color:#FF6B6B}
.tm-bar{height:4px;width:100%;border-radius:2px;margin-top:4px}

/* ── PLAY BOARD ── */
.play-cell{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#1a3a8a,#0a1a4a);border:3px solid #3366cc;border-radius:4px;cursor:pointer;transition:all .3s}
.play-cell:hover:not(.answered):not(.empty){transform:scale(1.02);border-color:#FFD700}
.play-cell.answered,.play-cell.empty{background:rgba(10,26,74,.3);border-color:rgba(51,102,204,.3);cursor:default}
.play-cell-pts{font-size:clamp(20px,3vw,36px);color:#FFD700;text-shadow:0 2px 8px rgba(0,0,0,.5)}

/* ── QUESTION MODAL ── */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);z-index:2000}
.question-modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:95vw;max-width:900px;max-height:95vh;padding:32px 32px 40px;background:linear-gradient(180deg,#1a3a8a,#0a1a4a);border:4px solid #3366cc;border-radius:12px;z-index:2001;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.modal-pts{font-size:48px;color:#FFD700;text-shadow:0 0 20px rgba(255,215,0,.5);text-align:center;flex-shrink:0}
.modal-content{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:80px}
.modal-img{max-width:100%;max-height:40vh;object-fit:contain;border-radius:8px}
.modal-text{font-size:26px;font-family:system-ui,sans-serif;color:#fff;line-height:1.4;text-align:center}
.yt-wrap{width:100%;max-width:560px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border-radius:8px;border:none}
.show-ans-btn{align-self:center;padding:16px 40px;font-size:22px;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:3px;background:linear-gradient(135deg,#228B22,#006400);border:3px solid #32CD32;border-radius:8px;color:#fff;cursor:pointer;flex-shrink:0}
.close-modal-btn{position:absolute;top:15px;right:15px;padding:8px 14px;font-size:20px;background:transparent;border:2px solid #666;border-radius:4px;color:#aaa;cursor:pointer}

/* ── SCORING SECTION ── */
.scoring-section{display:flex;flex-direction:column;align-items:center;gap:16px;flex-shrink:0}
.scoring-tiles{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
.sc-tile{display:flex;flex-direction:column;align-items:center;gap:4px;width:110px;flex-shrink:0}
.sc-photo{width:60px;height:60px;border-radius:50%;background:#1a1a3a;display:flex;align-items:center;justify-content:center;font-size:24px;color:#FFD700;overflow:hidden;flex-shrink:0}
.sc-photo img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.sc-name{font-size:13px;letter-spacing:1px;color:#ccc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:104px;text-align:center}
.sc-delta{font-size:16px;font-family:system-ui,sans-serif;font-weight:bold;text-align:center;min-height:22px}
.sc-delta.pos{color:#32CD32}
.sc-delta.neg{color:#FF6B6B}
.sc-delta.zero{color:rgba(255,255,255,.3)}
.sc-bar{height:4px;width:100%;border-radius:2px;margin-top:0}
.sc-controls{display:flex;align-items:stretch;gap:4px;width:100%;margin-top:4px}
.sc-adj{width:26px;flex-shrink:0;background:rgba(255,255,255,.08);border:1px solid #555;border-radius:4px;color:#ccc;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;line-height:1;transition:border-color .15s,color .15s}
.sc-adj:hover{border-color:#FFD700;color:#FFD700}
.sc-award{flex:1;padding:7px 2px;font-size:13px;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:1px;background:linear-gradient(135deg,#228B22,#006400);border:2px solid #32CD32;border-radius:4px;color:#fff;cursor:pointer;text-align:center;transition:opacity .2s,box-shadow .15s}
.sc-award:hover{box-shadow:0 0 8px rgba(50,205,50,.4)}
.sc-award.on{background:linear-gradient(135deg,#145214,#0a320a);border-color:#90EE90;box-shadow:0 0 10px rgba(50,205,50,.5)}
.sc-award.blocked{opacity:0.25;pointer-events:none;cursor:default}

.submit-scores-btn{align-self:center;width:100%;max-width:500px;padding:16px 40px;font-size:22px;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:3px;background:linear-gradient(180deg,#1a3a8a,#0a1a4a);border:3px solid #3366cc;border-radius:8px;color:#FFD700;cursor:pointer;position:absolute;bottom:0;left:50%;transform:translate(-50%,50%);z-index:10}

/* ── TEAM SETUP ── */
#team-setup-view{height:100vh;display:flex;align-items:center;justify-content:center;overflow-y:auto}
.setup-wrapper{width:100%;max-width:560px;padding:20px}
.setup-header{display:flex;align-items:center;gap:20px;margin-bottom:30px}
.setup-title{flex:1;font-size:36px;letter-spacing:4px;color:#FFD700;text-shadow:0 0 20px rgba(255,215,0,.4);margin:0}
.setup-content{background:rgba(26,58,138,.3);border:2px solid #3366cc;border-radius:12px;padding:30px}
.setup-sub{font-size:16px;color:#8888aa;font-family:system-ui,sans-serif;margin:0 0 25px;text-align:center}
.setup-teams-list{display:flex;flex-direction:column;gap:16px;margin-bottom:20px}
.setup-team-row{display:flex;align-items:center;gap:12px;padding:14px 15px;background:rgba(10,26,74,.5);border:2px solid #3366cc;border-radius:8px;flex-wrap:wrap;transition:border-color .2s}
.setup-team-row.first-turn{border-color:#FFD700;box-shadow:0 0 10px rgba(255,215,0,.25)}
.first-turn-btn{padding:6px 12px;font-size:12px;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:1px;background:transparent;border:2px solid #444;border-radius:4px;color:#666;cursor:pointer;white-space:nowrap}
.first-turn-btn.selected{background:rgba(255,215,0,.15);border-color:#FFD700;color:#FFD700}
.setup-num{font-size:18px;color:#FFD700;min-width:24px}
.setup-team-input{flex:1;min-width:120px;padding:10px 15px;font-size:18px;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:1px;background:rgba(255,255,255,.1);border:2px solid #4466aa;border-radius:4px;color:#fff;outline:none}
.setup-team-input:focus{border-color:#FFD700}
.team-photo-wrap{display:flex;flex-direction:column;align-items:center;gap:2px}
.team-photo-circle{width:48px;height:48px;border-radius:50%;border:2px solid #3366cc;background:#0a0a1a;display:flex;align-items:center;justify-content:center;font-size:20px;color:#555;cursor:pointer;overflow:hidden;flex-shrink:0}
.team-photo-circle img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.photo-hint{font-size:11px;color:#666;font-family:system-ui,sans-serif}
.photo-file-input{display:none}
.remove-team-btn{padding:8px 12px;font-size:16px;background:rgba(139,0,0,.5);border:2px solid #8B0000;border-radius:4px;color:#FF6B6B;cursor:pointer}
.add-team-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px 20px;font-size:18px;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:2px;background:transparent;border:2px dashed #666;border-radius:8px;color:#888;cursor:pointer;margin-bottom:20px}
.add-team-btn:hover{border-color:#FFD700;color:#FFD700}
.start-game-btn{width:100%;padding:18px 40px;font-size:24px;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:3px;background:linear-gradient(135deg,#228B22,#006400);border:3px solid #32CD32;border-radius:8px;color:#fff;cursor:pointer}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:15px 30px;background:linear-gradient(135deg,#228B22,#006400);border:2px solid #32CD32;border-radius:8px;color:#fff;font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:2px;font-size:18px;z-index:3000;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- HOME -->
<div id="home-view">
  <div class="home-wrapper">
    <div class="logo-section">
      <div class="logo-accent"></div>
      <h1 class="main-title">JEOPARDY!</h1>
      <p class="subtitle">Game Creator</p>
    </div>
    <button class="create-btn" onclick="createNewGame()">+ Create New Game</button>
    <div id="games-section" class="games-section hidden">
      <h2 class="section-title">Your Games</h2>
      <div id="games-list" class="games-list"></div>
    </div>
  </div>
</div>

<!-- TEAM SETUP -->
<div id="team-setup-view" class="hidden">
  <div class="setup-wrapper">
    <div class="setup-header">
      <button class="back-btn" onclick="goHome()">← Back</button>
      <h1 class="setup-title">Team Setup</h1>
    </div>
    <div class="setup-content">
      <p class="setup-sub">Name each team and optionally add a photo</p>
      <div id="setup-teams-list" class="setup-teams-list"></div>
      <button class="add-team-btn" onclick="addTeamInSetup()">+ Add Team</button>
      <button class="start-game-btn" onclick="startGame()">▶ Start Game</button>
    </div>
  </div>
</div>

<!-- EDIT VIEW -->
<div id="edit-view" class="hidden">
  <div class="edit-header">
    <button class="back-btn" onclick="goHome()">← Back</button>
    <input type="text" id="game-title-input" class="title-input" placeholder="Game Title">
    <div class="header-actions">
      <button class="save-btn" id="save-btn" onclick="saveCurrentGame()">

<script>
const PTS=[100,200,300,400,500],NCATS=5;
let games=[],currentGame=null;
let editCell=null,editDraft=null;
let selectedCell=null;
let teams=[{name:'Team 1',score:0,photo:null},{name:'Team 2',score:0,photo:null}];
let firstTurnIdx=0,turnSeq=[],turnStep=0,curTurn=0;
let dispScores=[],animFrame=null,tileOrder=[];
let awardedTo=null,manualAdj=[];

// ── Media popover state ──
let mpField=null; // 'qt' or 'at' — which field the popover is for
let mpMode=null;  // 'img' or 'yt'

// ══════════════════════════════════════════════
//  MEDIA POPOVER
// ══════════════════════════════════════════════
function openImgPopover(field, anchorBtn){
  mpField=field; mpMode='img';
  const pop=document.getElementById('media-popover');
  document.getElementById('mp-img-panel').classList.remove('hidden');
  document.getElementById('mp-yt-panel').classList.add('hidden');
  document.getElementById('mp-img-url').value='';
  document.getElementById('mp-img-status').textContent='';
  positionPopover(pop, anchorBtn);
  pop.classList.remove('hidden');
}

function openYtPopover(field, anchorBtn){
  mpField=field; mpMode='yt';
  const pop=document.getElementById('media-popover');
  document.getElementById('mp-img-panel').classList.add('hidden');
  document.getElementById('mp-yt-panel').classList.remove('hidden');
  document.getElementById('mp-yt-url').value='';
  document.getElementById('mp-yt-times').classList.add('hidden');
  document.getElementById('mp-yt-status').textContent='';
  positionPopover(pop, anchorBtn);
  pop.classList.remove('hidden');
}

function positionPopover(pop, anchor){
  // Position below the anchor button
  const r=anchor.getBoundingClientRect();
  pop.style.top=(r.bottom+6)+'px';
  pop.style.left=Math.min(r.left, window.innerWidth-330)+'px';
}

function closePopover(){
  document.getElementById('media-popover').classList.add('hidden');
  mpField=null; mpMode=null;
}

// Close popover when clicking outside
document.addEventListener('mousedown',e=>{
  const pop=document.getElementById('media-popover');
  if(!pop.classList.contains('hidden') && !pop.contains(e.target)){
    // don't close if clicking one of the toolbar media buttons
    if(!e.target.closest('.rt-btn')) closePopover();
  }
});

function mpImgUpload(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onloadend=()=>compress(r.result,800,.75).then(src=>{
    applyMediaToDraft(mpField,'image',src);
    document.getElementById('mp-img-status').textContent='✓ Image attached';
    updateMediaBadge(mpField);
    setTimeout(closePopover,800);
  });
  r.readAsDataURL(f);
  e.target.value='';
}

function mpImgUrl(){
  const url=document.getElementById('mp-img-url').value.trim();
  if(!url) return;
  applyMediaToDraft(mpField,'image',url);
  document.getElementById('mp-img-status').textContent='✓ Image attached';
  updateMediaBadge(mpField);
  setTimeout(closePopover,800);
}

function mpYtLoad(){
  const id=ytId(document.getElementById('mp-yt-url').value);
  if(!id){ document.getElementById('mp-yt-status').textContent='⚠ Could not find YouTube ID'; return; }
  // store provisional id in draft
  if(!editDraft) return;
  const key=mpField==='qt'?'qYoutube':'aYoutube';
  editDraft[key]={id,start:0,end:null};
  document.getElementById('mp-yt-status').textContent=`✓ Video: ${id}`;
  document.getElementById('mp-yt-times').classList.remove('hidden');
  document.getElementById('mp-yt-start').value='';
  document.getElementById('mp-yt-end').value='';
}

function mpYtApply(){
  if(!editDraft) return;
  const key=mpField==='qt'?'qYoutube':'aYoutube';
  if(!editDraft[key]) return;
  editDraft[key].start=parseInt(document.getElementById('mp-yt-start').value)||0;
  const ev=document.getElementById('mp-yt-end').value;
  editDraft[key].end=ev===''?null:parseInt(ev);
  // clear image for this field
  const imgKey=mpField==='qt'?'image':'aImage';
  editDraft[imgKey]=null;
  updateMediaBadge(mpField);
  closePopover();
}

function applyMediaToDraft(field, type, value){
  if(!editDraft) return;
  if(field==='qt'){
    if(type==='image'){ editDraft.image=value; editDraft.qYoutube=null; }
  } else {
    if(type==='image'){ editDraft.aImage=value; editDraft.aYoutube=null; }
  }
}

function updateMediaBadge(field){
  const toolbarId=field+'-toolbar';
  const toolbar=document.getElementById(toolbarId);
  // remove existing badge
  toolbar.querySelectorAll('.media-badge').forEach(b=>b.remove());
  if(!editDraft) return;
  let label=null;
  if(field==='qt'){
    if(editDraft.image) label='🖼 Image';
    else if(editDraft.qYoutube) label='▶ Video';
  } else {
    if(editDraft.aImage) label='🖼 Image';
    else if(editDraft.aYoutube) label='▶ Video';
  }
  if(label){
    const badge=document.createElement('span');
    badge.className='media-badge';
    badge.innerHTML=`${label}<button class="media-badge-remove" onclick="removeMediaFromField('${field}')">✕</button>`;
    toolbar.appendChild(badge);
  }
}

function removeMediaFromField(field){
  if(!editDraft) return;
  if(field==='qt'){ editDraft.image=null; editDraft.qYoutube=null; }
  else { editDraft.aImage=null; editDraft.aYoutube=null; }
  updateMediaBadge(field);
}

// ══════════════════════════════════════════════
//  SCOREBOARD
// ══════════════════════════════════════════════
function buildTileOrder(){
  const allZero=teams.every(t=>t.score===0);
  if(allZero){
    tileOrder=teams.map((_,i)=>i).sort((a,b)=>
      ((a-firstTurnIdx+teams.length)%teams.length)-((b-firstTurnIdx+teams.length)%teams.length));
  } else {
    tileOrder=teams.map((_,i)=>i).sort((a,b)=>teams[a].score-teams[b].score);
  }
}

function renderScoreboard(){
  buildTileOrder();
  const sb=document.getElementById('scoreboard');
  if(!sb.querySelector('.team-tile')){
    sb.innerHTML='';
    teams.forEach((_,i)=>{
      const el=document.createElement('div');
      el.className='team-tile'; el.id='stb-'+i;
      sb.appendChild(el);
    });
  }
  const allZero=teams.every(t=>t.score===0);
  const maxScore=allZero?null:Math.max(...teams.map(t=>t.score));
  tileOrder.forEach((ti,rank)=>{
    const tile=document.getElementById('stb-'+ti);
    tile.style.order=rank;
    const t=teams[ti],d=dispScores[ti];
    const leading=!allZero&&t.score===maxScore;
    const myTurn=ti===curTurn;
    const photoBorder=leading?'3px solid #FFD700':'3px solid #3366cc';
    const photoGlow=leading?'0 0 12px rgba(255,215,0,.55)':'none';
    const barBg=myTurn?(leading?'#FFD700':'#3366cc'):'rgba(255,255,255,.15)';
    const barGlow=myTurn&&leading?'0 0 8px rgba(255,215,0,.6)':'none';
    tile.innerHTML=`
      <div class="tm-photo" style="border:${photoBorder};box-shadow:${photoGlow}">
        ${t.photo?`<img src="${t.photo}" alt="">`:t.name[0].toUpperCase()}
      </div>
      <div class="tm-name">${esc(t.name)}</div>
      <div class="tm-score${d<0?' neg':''}">$${d.toLocaleString()}</div>
      <div class="tm-bar" style="background:${barBg};box-shadow:${barGlow}"></div>`;
  });
}

// ══════════════════════════════════════════════
//  SCORE ANIMATION
// ══════════════════════════════════════════════
function animateScores(targets){
  if(animFrame) cancelAnimationFrame(animFrame);
  const start=dispScores.slice();
  const deltas=targets.map((t,i)=>Math.abs(t-start[i]));
  const maxDelta=Math.max(...deltas,1);
  const baseDur=2400;
  const durs=deltas.map(d=>d===0?0:Math.round(baseDur*(d/maxDelta)));
  buildTileOrder();
  const orderBefore=tileOrder.slice();
  const t0=performance.now();
  const changers=targets.map((t,i)=>t!==start[i]?i:-1).filter(i=>i>=0);
  changers.forEach(i=>{ const tile=document.getElementById('stb-'+i); if(tile) tile.classList.add('lifting'); });
  teams.forEach((t,i)=>t.score=targets[i]);

  function step(now){
    const elapsed=now-t0;
    teams.forEach((_,i)=>{
      if(durs[i]===0){dispScores[i]=targets[i];return;}
      const p=Math.min(elapsed/durs[i],1),e=1-Math.pow(1-p,3);
      dispScores[i]=Math.round(start[i]+(targets[i]-start[i])*e);
    });
    changers.forEach(i=>{
      const tile=document.getElementById('stb-'+i);
      if(!tile||tile._settled) return;
      if(elapsed>=durs[i]){
        tile._settled=true;
        setTimeout(()=>{tile.classList.remove('lifting');tile.style.zIndex=1;},50);
      }
    });
    renderScoreboard();
    const allDone=teams.every((_,i)=>durs[i]===0||elapsed>=durs[i]);
    if(!allDone){ animFrame=requestAnimationFrame(step); }
    else {
      dispScores=targets.slice(); renderScoreboard();
      changers.forEach(i=>{ const t=document.getElementById('stb-'+i); if(t) t._settled=false; });
    }
  }
  animFrame=requestAnimationFrame(step);
}

// ══════════════════════════════════════════════
//  SCORING TILES
// ══════════════════════════════════════════════
function renderScoringTiles(){
  const q=currentGame.categories[selectedCell.ci].questions[selectedCell.qi];
  const basePts=q.points;
  const allZero=teams.every(t=>t.score===0);
  const maxScore=allZero?null:Math.max(...teams.map(t=>t.score));
  const ordered=teams.map((_,i)=>i).sort((a,b)=>
    ((a-curTurn+teams.length)%teams.length)-((b-curTurn+teams.length)%teams.length));
  document.getElementById('scoring-tiles').innerHTML=ordered.map(ti=>{
    const t=teams[ti];
    const totalDelta=(manualAdj[ti]||0)+(awardedTo===ti?basePts:0);
    const deltaLabel=totalDelta===0?'–':(totalDelta>0?`+${totalDelta}`:`-${Math.abs(totalDelta)}`);
    const deltaCls=totalDelta>0?'pos':totalDelta<0?'neg':'zero';
    const leading=!allZero&&t.score===maxScore;
    const myTurn=ti===curTurn;
    const photoBorder=leading?'3px solid #FFD700':'3px solid #3366cc';
    const photoGlow=leading?'0 0 12px rgba(255,215,0,.55)':'none';
    const barBg=myTurn?(leading?'#FFD700':'#3366cc'):'rgba(255,255,255,.15)';
    const barGlow=myTurn&&leading?'0 0 8px rgba(255,215,0,.6)':'none';
    const isOn=awardedTo===ti;
    const isBlocked=awardedTo!==null&&awardedTo!==ti;
    const awardCls='sc-award'+(isOn?' on':'')+(isBlocked?' blocked':'');
    return `<div class="sc-tile" id="sct-${ti}">
      <div class="sc-photo" style="border:${photoBorder};box-shadow:${photoGlow}">
        ${t.photo?`<img src="${t.photo}" alt="">`:t.name[0].toUpperCase()}
      </div>
      <div class="sc-name">${esc(t.name)}</div>
      <div class="sc-delta ${deltaCls}">${deltaLabel}</div>
      <div class="sc-bar" style="background:${barBg};box-shadow:${barGlow}"></div>
      <div class="sc-controls">
        <button class="sc-adj" onclick="doAdj(${ti},-100)">−</button>
        <button class="${awardCls}" onclick="doAward(${ti})">+${basePts}</button>
        <button class="sc-adj" onclick="doAdj(${ti},100)">+</button>
      </div>
    </div>`;
  }).join('');
}

function doAdj(ti,amount){ manualAdj[ti]=(manualAdj[ti]||0)+amount; renderScoringTiles(); }
function doAward(ti){
  if(awardedTo!==null&&awardedTo!==ti) return;
  awardedTo=(awardedTo===ti)?null:ti;
  renderScoringTiles();
}

// ══════════════════════════════════════════════
//  QUESTION MODAL
// ══════════════════════════════════════════════
function openQuestion(ci,qi){
  const q=currentGame.categories[ci].questions[qi];
  if(q.answered||!(q.questionHtml||q.image||q.qYoutube||q.aImage||q.aYoutube)) return;
  selectedCell={ci,qi};
  awardedTo=null; manualAdj=teams.map(()=>0);
  document.getElementById('modal-pts').textContent=`$${q.points}`;
  setModalContent(q,'question');
  document.getElementById('show-ans-btn').classList.remove('hidden');
  document.getElementById('scoring-section').classList.add('hidden');
  document.getElementById('modal-overlay').classList.remove('hidden');
  document.getElementById('question-modal').classList.remove('hidden');
}

function setModalContent(q, phase){
  const el=document.getElementById('modal-content');
  el.innerHTML=''; // clear first

  function makeYt(yt){
    const wrap=document.createElement('div');
    wrap.className='yt-wrap';
    const iframe=document.createElement('iframe');
    let src=`https://www.youtube.com/embed/${yt.id}?autoplay=1&start=${yt.start||0}`;
    if(yt.end) src+=`&end=${yt.end}`;
    iframe.src=src;
    iframe.setAttribute('allow','autoplay; encrypted-media; fullscreen');
    iframe.setAttribute('allowfullscreen','');
    iframe.setAttribute('frameborder','0');
    iframe.style.cssText='width:100%;aspect-ratio:16/9;border-radius:8px;border:none';
    wrap.appendChild(iframe);
    return wrap;
  }

  function makeImg(src){
    const img=document.createElement('img');
    img.className='modal-img'; img.src=src; img.alt='';
    return img;
  }

  function makeText(html){
    const div=document.createElement('div');
    div.className='modal-text'; div.innerHTML=html;
    return div;
  }

  if(phase==='question'){
    if(q.qYoutube) el.appendChild(makeYt(q.qYoutube));
    else if(q.image) el.appendChild(makeImg(q.image));
    if(q.questionHtml) el.appendChild(makeText(q.questionHtml));
  } else {
    if(q.aYoutube) el.appendChild(makeYt(q.aYoutube));
    else if(q.aImage) el.appendChild(makeImg(q.aImage));
    el.appendChild(makeText(q.answerHtml||'<em style="color:#888">No answer</em>'));
  }
}

function showAnswer(){
  const q=currentGame.categories[selectedCell.ci].questions[selectedCell.qi];
  setModalContent(q,'answer');
  document.getElementById('show-ans-btn').classList.add('hidden');
  renderScoringTiles();
  document.getElementById('scoring-section').classList.remove('hidden');
}

function submitScores(awarded){
  const q=currentGame.categories[selectedCell.ci].questions[selectedCell.qi];
  const basePts=q.points;
  const newScores=teams.map((t,i)=>{ let d=manualAdj[i]||0; if(i===awarded) d+=basePts; return t.score+d; });
  q.answered=true;
  turnStep=(turnStep+1)%teams.length; curTurn=turnSeq[turnStep];
  closeModal(); renderPlayBoard(); renderScoreboard();
  setTimeout(()=>animateScores(newScores),600);
}

function closeModal(){
  const el=document.getElementById('modal-content');
  el.querySelectorAll('iframe').forEach(f=>{f.src='';});
  el.innerHTML='';
  selectedCell=null; awardedTo=null; manualAdj=[];
  document.getElementById('modal-overlay').classList.add('hidden');
  document.getElementById('question-modal').classList.add('hidden');
}

// ══════════════════════════════════════════════
//  RICH TEXT
// ══════════════════════════════════════════════
function rtArea(id){return document.getElementById(id+'-area')}
function rtCmd(id,cmd){rtArea(id).focus();document.execCommand(cmd,false,null);syncRT(id)}
function rtSize(id,dir){
  rtArea(id).focus();
  const sel=window.getSelection();if(!sel.rangeCount)return;
  const r=sel.getRangeAt(0);if(r.collapsed)return;
  const node=r.startContainer.parentElement;
  let cur=parseFloat(window.getComputedStyle(node).fontSize)||15;
  cur=dir==='up'?Math.min(cur+4,72):Math.max(cur-4,8);
  const sp=document.createElement('span');sp.style.fontSize=cur+'px';
  try{r.surroundContents(sp)}catch(e){document.execCommand('fontSize',false,'3')}
  syncRT(id);
}
function rtColor(id){const c=prompt('CSS color:','#FFD700');if(c){rtArea(id).focus();document.execCommand('foreColor',false,c);syncRT(id);}}
function syncRT(id){
  if(!editDraft)return;
  if(id==='qt')editDraft.questionHtml=rtArea('qt').innerHTML;
  if(id==='at')editDraft.answerHtml=rtArea('at').innerHTML;
}
function handlePaste(e,id){
  const items=e.clipboardData.items;
  for(let i=0;i<items.length;i++){
    if(items[i].type.startsWith('image/')){
      e.preventDefault();
      const f=items[i].getAsFile(),r=new FileReader();
      r.onload=ev=>compress(ev.target.result,800,.75).then(img=>{document.execCommand('insertImage',false,img);syncRT(id);});
      r.readAsDataURL(f);return;
    }
  }
  setTimeout(()=>syncRT(id),0);
}

// ══════════════════════════════════════════════
//  CORE GAME
// ══════════════════════════════════════════════
document.addEventListener('DOMContentLoaded',loadGames);
document.addEventListener('keydown',e=>{
  const m=document.getElementById('question-modal');
  if(m.classList.contains('hidden'))return;
  if(e.code==='Space'){e.preventDefault();const b=document.getElementById('show-ans-btn');if(!b.classList.contains('hidden'))showAnswer();}
  if(e.code==='Escape')closeModal();
});

function mkGame(title='Untitled Game'){
  return{id:''+Date.now(),title,createdAt:new Date().toISOString(),
    categories:Array(NCATS).fill(null).map((_,i)=>({
      name:`Category ${i+1}`,
      questions:PTS.map(p=>({points:p,questionHtml:'',answerHtml:'',image:null,qYoutube:null,aImage:null,aYoutube:null,answered:false}))
    }))};
}
function loadGames(){const s=localStorage.getItem('jeopardy-games');if(s){games=JSON.parse(s);renderGameList();}}
function saveGames(){localStorage.setItem('jeopardy-games',JSON.stringify(games));}
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}

function renderGameList(){
  const sec=document.getElementById('games-section'),list=document.getElementById('games-list');
  if(!games.length){sec.classList.add('hidden');return;}
  sec.classList.remove('hidden');
  list.innerHTML=games.map(g=>`
    <div class="game-card">
      <div><h3 class="game-title">${esc(g.title)}</h3><p class="game-date">${new Date(g.createdAt).toLocaleDateString()}</p></div>
      <div class="game-actions">
        <button class="btn-play" onclick="loadGame('${g.id}','play')">▶ Play</button>
        <button class="btn-edit" onclick="loadGame('${g.id}','edit')">✎ Edit</button>
        <button class="btn-del" onclick="delGame('${g.id}')">✕</button>
      </div>
    </div>`).join('');
}

function createNewGame(){currentGame=mkGame();showView('edit');renderEditBoard();document.getElementById('game-title-input').value=currentGame.title;}

function loadGame(id,mode){
  const g=games.find(x=>x.id===id);if(!g)return;
  currentGame=JSON.parse(JSON.stringify(g));
  currentGame.categories.forEach(cat=>cat.questions.forEach(q=>{
    if(!q.questionHtml&&q.question){q.questionHtml=esc(q.question);delete q.question;}
    if(!q.answerHtml&&q.answer){q.answerHtml=esc(q.answer);delete q.answer;}
    q.questionHtml=q.questionHtml||''; q.answerHtml=q.answerHtml||'';
    // migrate old youtube/image to new per-field format
    if(q.youtube&&!q.qYoutube){q.qYoutube=q.youtube;delete q.youtube;}
    if(!q.qYoutube) q.qYoutube=null;
    if(!q.aYoutube) q.aYoutube=null;
    if(!q.aImage) q.aImage=null;
    if(!q.image) q.image=null;
  }));
  if(mode==='play'){
    currentGame.categories.forEach(cat=>cat.questions.forEach(q=>q.answered=false));
    resetTeams(); showView('team-setup'); renderSetupTeams();
  } else {
    showView('edit'); renderEditBoard(); document.getElementById('game-title-input').value=currentGame.title;
  }
}

function playCurrentGame(){
  currentGame.categories.forEach(cat=>cat.questions.forEach(q=>q.answered=false));
  resetTeams(); showView('team-setup'); renderSetupTeams();
}

function delGame(id){if(confirm('Delete this game?')){games=games.filter(g=>g.id!==id);saveGames();renderGameList();}}

async function saveCurrentGame(){
  const btn=document.getElementById('save-btn'),ico=document.getElementById('save-icon'),
        sp=document.getElementById('save-spinner'),tx=document.getElementById('save-text');
  btn.disabled=true;ico.classList.add('hidden');sp.classList.remove('hidden');tx.textContent='Saving…';
  try{
    currentGame.title=document.getElementById('game-title-input').value||'Untitled Game';
    const i=games.findIndex(g=>g.id===currentGame.id);
    if(i>=0)games[i]=currentGame;else games.push(currentGame);
    await new Promise(r=>setTimeout(r,300));saveGames();
    sp.classList.add('hidden');ico.classList.remove('hidden');ico.textContent='✓';tx.textContent='Saved!';
    setTimeout(()=>{ico.textContent='💾';tx.textContent='Save Game';btn.disabled=false;},2000);
  }catch(e){sp.classList.add('hidden');ico.classList.remove('hidden');tx.textContent='Failed';btn.disabled=false;setTimeout(()=>tx.textContent='Save Game',2000);}
}

function goHome(){showView('home');renderGameList();}
function showView(v){['home','team-setup','edit','play'].forEach(n=>document.getElementById(n+'-view').classList.toggle('hidden',v!==n));}

// ══════════════════════════════════════════════
//  EDIT BOARD & POPUP
// ══════════════════════════════════════════════
function renderEditBoard(){
  const board=document.getElementById('edit-board');
  let h='<div class="cat-row">';
  currentGame.categories.forEach((c,ci)=>{h+=`<input class="cat-input" value="${esc(c.name)}" onchange="currentGame.categories[${ci}].name=this.value">`;});
  h+='</div>';
  PTS.forEach((pts,qi)=>{
    h+='<div class="q-row">';
    currentGame.categories.forEach((c,ci)=>{
      const q=c.questions[qi],f=!!(q.questionHtml||q.image||q.qYoutube);
      h+=`<div class="edit-cell${f?' filled':''}" onclick="openPopup(${ci},${qi})">
            <div style="display:flex;flex-direction:column;align-items:center;gap:5px">
              <span class="cell-pts">$${pts}</span>${f?'<span class="cell-check">✓</span>':''}
            </div></div>`;
    });
    h+='</div>';
  });
  board.innerHTML=h;
}

function openPopup(ci,qi){
  editCell={ci,qi};
  const q=currentGame.categories[ci].questions[qi];
  editDraft=JSON.parse(JSON.stringify(q));
  // ensure new fields exist
  if(!('qYoutube' in editDraft)) editDraft.qYoutube=null;
  if(!('aYoutube' in editDraft)) editDraft.aYoutube=null;
  if(!('aImage' in editDraft)) editDraft.aImage=null;
  document.getElementById('popup-pts').textContent=`$${q.points}`;
  rtArea('qt').innerHTML=editDraft.questionHtml||'';
  rtArea('at').innerHTML=editDraft.answerHtml||'';
  updateMediaBadge('qt');
  updateMediaBadge('at');
  document.getElementById('edit-overlay').classList.remove('hidden');
  document.getElementById('edit-popup').classList.remove('hidden');
}

function savePopup(){
  if(editCell&&editDraft){
    syncRT('qt');syncRT('at');
    const q=currentGame.categories[editCell.ci].questions[editCell.qi];
    Object.assign(q,{
      questionHtml:editDraft.questionHtml, answerHtml:editDraft.answerHtml,
      image:editDraft.image, qYoutube:editDraft.qYoutube,
      aImage:editDraft.aImage, aYoutube:editDraft.aYoutube
    });
    renderEditBoard();
  }
  editCell=null;editDraft=null;closePopover();
  document.getElementById('edit-overlay').classList.add('hidden');
  document.getElementById('edit-popup').classList.add('hidden');
}

function discardPopup(){
  editCell=null;editDraft=null;closePopover();
  document.getElementById('edit-overlay').classList.add('hidden');
  document.getElementById('edit-popup').classList.add('hidden');
}

// ══════════════════════════════════════════════
//  TEAM SETUP
// ══════════════════════════════════════════════
function renderSetupTeams(){
  document.getElementById('setup-teams-list').innerHTML=teams.map((t,i)=>`
    <div class="setup-team-row${firstTurnIdx===i?' first-turn':''}">
      <span class="setup-num">${i+1}.</span>
      <div class="team-photo-wrap">
        <div class="team-photo-circle" onclick="document.getElementById('pf-${i}').click()">
          ${t.photo?`<img src="${t.photo}" alt="">`:'📷'}
        </div>
        <span class="photo-hint">Photo</span>
        <input type="file" id="pf-${i}" class="photo-file-input" accept="image/*" onchange="uploadTeamPhoto(event,${i})">
      </div>
      <input class="setup-team-input" value="${esc(t.name)}" onchange="teams[${i}].name=this.value" placeholder="Team name">
      <button class="first-turn-btn${firstTurnIdx===i?' selected':''}" onclick="setFirstTurn(${i})">
        ${firstTurnIdx===i?'★ Goes first':'Goes first?'}
      </button>
      ${teams.length>1?`<button class="remove-team-btn" onclick="removeTeam(${i})">✕</button>`:''}
    </div>`).join('');
}

function resetTeams(){
  teams=[{name:'Team 1',score:0,photo:null},{name:'Team 2',score:0,photo:null}];
  firstTurnIdx=0;
}
function uploadTeamPhoto(e,idx){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onloadend=()=>compress(r.result,200,.8).then(d=>{teams[idx].photo=d;renderSetupTeams();});
  r.readAsDataURL(f);e.target.value='';
}
function addTeamInSetup(){teams.push({name:`Team ${teams.length+1}`,score:0,photo:null});renderSetupTeams();}
function removeTeam(i){if(teams.length>1){teams.splice(i,1);if(firstTurnIdx>=teams.length)firstTurnIdx=0;renderSetupTeams();}}

function startGame(){
  turnSeq=teams.map((_,i)=>(firstTurnIdx+i)%teams.length);
  turnStep=0; curTurn=turnSeq[0];
  dispScores=teams.map(()=>0);
  showView('play'); renderPlayBoard(); renderScoreboard();
  document.getElementById('play-title').textContent=currentGame.title;
}

// ══════════════════════════════════════════════
//  PLAY BOARD
// ══════════════════════════════════════════════
function renderPlayBoard(){
  const board=document.getElementById('play-board');
  let h='<div class="cat-row">';
  currentGame.categories.forEach(c=>{h+=`<div class="cat-header">${esc(c.name)}</div>`;});
  h+='</div>';
  PTS.forEach((pts,qi)=>{
    h+='<div class="q-row">';
    currentGame.categories.forEach((c,ci)=>{
      const q=c.questions[qi],ans=q.answered,has=!!(q.questionHtml||q.image||q.qYoutube);
      // no thumbnails on play board
      h+=`<div class="play-cell${ans?' answered':''}${!has?' empty':''}" onclick="openQuestion(${ci},${qi})">
            <div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%">
              ${!ans&&has?`<span class="play-cell-pts">$${pts}</span>`:''}
            </div></div>`;
    });
    h+='</div>';
  });
  board.innerHTML=h;
}

// ══════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════
function ytId(raw){
  raw=raw.trim();
  if(/^[A-Za-z0-9_-]{11}$/.test(raw))return raw;
  const m=raw.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);return m?m[1]:null;
}
function compress(b64,maxW,q){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      let w=img.width,h=img.height;
      if(w>maxW){h=h*maxW/w;w=maxW;}
      c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
      res(c.toDataURL('image/jpeg',q));
    };
    img.src=b64;
  });
}
function toggleFullscreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen();}
document.addEventListener('fullscreenchange',()=>{const b=document.querySelector('.fullscreen-btn');if(b)b.textContent=document.fullscreenElement?'✕ Exit Fullscreen':'⛶ Fullscreen';});
</script>
